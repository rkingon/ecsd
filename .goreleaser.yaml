version: 2

builds:
  - main: ./cmd/ecsd
    binary: ecsd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "ecsd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, schema/v1/*.json]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  prerelease: auto # v0.1.0-alpha.1 and the like are marked pre-release
